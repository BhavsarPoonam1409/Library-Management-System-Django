{% extends 'library/base.html' %}

{% block title %}Issue Book | College Library{% endblock %}

{% block content %}

<div class="form-container">
    <h1 class="page-heading">Issue a Book</h1>

    <p class="page-description">
        Select a student and book, then enter the issue details.
    </p>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">
            Issue Book
        </button>

        <a href="{% url 'issue_list' %}" class="btn btn-secondary">
            Cancel
        </a>
    </form>
</div>

{% endblock %}
