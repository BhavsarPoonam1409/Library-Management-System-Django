{% extends 'library/base.html' %}

{% block title %}Book Form | College Library{% endblock %}

{% block content %}

<div class="form-container">
    <h1 class="page-heading">Book Details</h1>

    <p class="page-description">
        Enter the book information below.
    </p>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">
            Save Book
        </button>

        <a href="{% url 'book_list' %}" class="btn btn-secondary">
            Cancel
        </a>
    </form>
</div>

{% endblock %}
